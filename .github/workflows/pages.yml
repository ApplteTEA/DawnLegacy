name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify field engine
        run: |
          node --check bootstrap.js
          node --check field-manifest.js
          node --check field-actors.js
          node --check world-v2.js
          node --check game.js
          node --check rival-system.js
          node --check campaign-system.js
          node tests/field-actors.test.cjs
          node tests/rival-system.test.cjs
          node tests/rival-encounter.test.cjs
          node tests/rival-growth.test.cjs
          node --check campaign-data.js
          node --check campaign-core.js
          node tests/campaign-core.test.cjs
          node tests/restart-rival-visibility.test.cjs
          node tests/campaign-system.test.cjs
      - name: Configure Pages and initialize site
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
