<!doctype html><html lang="ko"><meta charset="utf-8"><title>DawnLegacy 세로 화면 검증</title><style>body{margin:20px;background:#182a31;color:#e3ebdf;font:14px system-ui}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}button,select{padding:8px}main{display:flex;gap:24px;align-items:flex-start}iframe{border:2px solid #b6c9ac;width:390px;height:844px;flex-shrink:0}pre{white-space:pre-wrap;max-width:420px}canvas{image-rendering:pixelated;width:288px;height:512px;background:#8cbe78}</style><header><b>390 × 844 · 실제 게임 iframe</b><button id="fixture">테스트 세이브</button><button id="research">연구원 앞</button><button id="battle">트레이너 앞</button><button id="refresh">상태 읽기</button><label>동행<select id="species"><option>브케인</option><option>치코리타</option><option>리아코</option><option>피카츄</option><option>이브이</option><option>롱스톤</option></select></label><label>인물<select id="human"><option>hero</option><option>researcher</option><option>ranger</option><option>leader</option><option>traveler</option></select></label></header><main><iframe id="game" src="../index.html"></iframe><section><pre id="status"></pre><canvas id="atlas" width="72" height="128"></canvas><p>위에서부터 후면 / 우측 / 정면 / 좌측 · 방향당 3프레임</p></section></main><script>
const frame=document.getElementById('game'),status=document.getElementById('status');
const run=code=>frame.contentWindow.eval(code);
const refresh=()=>{try{status.textContent=run(`JSON.stringify({viewport:[innerWidth,innerHeight],mode,dialogOpen,player:[s.x,s.y,s.face],follower:s.fieldFollower,partner:s.party[0]?.name,steps:s.steps,loaded:[...document.images].filter(i=>!i.complete).length},null,2)`)}catch(e){status.textContent=e.message}};
document.getElementById('fixture').onclick=()=>{run(`close();s.type='불꽃';s.party=[createMon('브케인',5,false)];s.x=10;s.y=8;s.face=2;s.steps=0;s.grassSteps=0;delete s.fieldFollower;delete s.followerTrail;FIELD_ACTORS.reset(s,(x,y)=>!fieldHouse(x,y)&&!NPCS.some(n=>n.x===x&&n.y===y));save();updateHud()`);refresh()};
document.getElementById('research').onclick=()=>{run(`close();s.x=13;s.y=9;s.face=0;delete s.fieldFollower;FIELD_ACTORS.reset(s,(x,y)=>!fieldHouse(x,y)&&!NPCS.some(n=>n.x===x&&n.y===y))`);refresh()};
document.getElementById('battle').onclick=()=>{run(`close();s.x=25;s.y=12;s.face=0;delete s.fieldFollower;FIELD_ACTORS.reset(s,(x,y)=>!fieldHouse(x,y)&&!NPCS.some(n=>n.x===x&&n.y===y))`);refresh()};
document.getElementById('refresh').onclick=refresh;
document.getElementById('species').onchange=e=>{run(`s.party[0]=createMon(${JSON.stringify(e.target.value)},5,false)`);refresh()};
const atlas=document.getElementById('atlas'),ctx=atlas.getContext('2d');
function showHuman(name){const im=new Image();im.onload=()=>{ctx.clearRect(0,0,72,128);ctx.drawImage(im,0,0)};im.src='../assets/field/'+name+'.png'}
document.getElementById('human').onchange=e=>showHuman(e.target.value);showHuman('hero');frame.onload=refresh;
</script></html>
