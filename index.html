<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#183d30"><title>여명의 유산</title><style>*{box-sizing:border-box}body{margin:0;background:#17382e;color:white;font:16px system-ui;touch-action:none}header{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;background:#234a39}#game{height:calc(100dvh - 166px);display:grid;place-items:center;position:relative}canvas{max-width:100%;max-height:100%;image-rendering:pixelated}#info{position:absolute;top:8px;left:8px;background:#17382edc;border-radius:6px;padding:6px;font-size:12px}#controls{height:122px;display:flex;justify-content:space-between;align-items:center;padding:4px 6vw;background:#234a39}button{border:0;border-radius:10px;padding:11px;background:#ead5a0;color:#263a30;font-weight:bold;font-size:15px;touch-action:manipulation}#pad{display:grid;grid-template-columns:repeat(3,46px);gap:3px}#pad button{height:36px;padding:0}#actions{display:flex;gap:16px}#actions button{width:61px;height:61px;border-radius:50%;background:#c95c4d;color:white}#actions button:first-child{background:#788aa9}#overlay{display:none;position:fixed;inset:0;background:#07190cbb;z-index:3;align-items:center;justify-content:center;padding:16px}#panel{width:min(520px,96vw);max-height:85dvh;overflow:auto;background:#f8eed1;color:#283b2c;border:5px solid #aa8954;border-radius:13px;padding:16px}#panel button{margin:4px;background:#436e51;color:white}#x{float:right;background:#b75c50!important}select{font-size:16px;padding:9px}</style></head><body><header><b>여명의 유산 · v0.3</b><button id="menu">메뉴</button></header><div id="game"><canvas id="map" width="320" height="240"></canvas><div id="info"></div></div><div id="controls"><div id="pad"><span></span><button data-dir="0,-1">▲</button><span></span><button data-dir="-1,0">◀</button><button data-dir="0,1">▼</button><button data-dir="1,0">▶</button></div><div id="actions"><button id="b">B</button><button id="a">A</button></div></div><div id="overlay"><div id="panel"><button id="x">✕</button><div id="content"></div></div></div><script>
const $=x=>document.getElementById(x),ctx=$('map').getContext('2d'),types=['노말','불꽃','물','풀','전기','얼음','격투','독','땅','비행','에스퍼','벌레','바위','고스트','드래곤','악','강철'],data=[['구구','노말','비행'],['꼬렛','노말'],['캐터피','벌레'],['뿔충이','벌레','독'],['모다피','풀','독'],['주뱃','독','비행'],['꼬마돌','바위','땅'],['메리프','전기'],['우파','물','땅'],['델빌','악','불꽃'],['이브이','노말'],['브케인','불꽃'],['리아코','물'],['치코리타','풀'],['고오스','고스트','독'],['피카츄','전기'],['식스테일','불꽃'],['가디','불꽃'],['미뇽','드래곤'],['무우마','고스트'],['코일','전기','강철'],['롱스톤','바위','땅'],['애버라스','바위','땅'],['네이티','에스퍼','비행'],['니로우','악','비행'],['피콘','벌레']],evo={'이브이':['불꽃','물','전기','에스퍼','악'],'롱스톤':['강철'],'애버라스':['악'],'피콘':['강철']};let s;try{s=JSON.parse(localStorage.getItem('dawnLegacyV3'))}catch{}if(!s)s={type:'',x:9,y:9,party:[],box:[],balls:10};let foe=null;
function save(){try{localStorage.setItem('dawnLegacyV3',JSON.stringify(s))}catch{}}function show(h){$('content').innerHTML=h;$('overlay').style.display='flex'}function hide(){$('overlay').style.display='none'}$('x').onclick=hide;$('b').onclick=hide;$('overlay').onclick=e=>{if(e.target===$('overlay'))hide()};function make(name,shiny=false){let row=data.find(p=>p[0]===name);return{name,types:row?row.slice(1):[s.type],shiny,level:5,hp:23,max:23,xp:0}}function legal(p){return p.shiny||p.types.includes(s.type)||(evo[p.name]||[]).includes(s.type)}
function begin(){show('<h2>여명지방의 모험</h2><p>도전할 타입을 선택하세요.</p><select id="type">'+types.map(t=>'<option>'+t+'</option>').join('')+'</select><p><button id="roll">스타팅 룰렛</button></p><p>진화 후 해당 타입이 되는 포켓몬도 허용됩니다.</p>');$('roll').onclick=()=>{s.type=$('type').value;let pool=data.filter(p=>p.slice(1).includes(s.type)||(evo[p[0]]||[]).includes(s.type));let chosen=pool[Math.floor(Math.random()*pool.length)];let p=make(chosen[0],Math.random()<1/8192);s.party=[p];save();show('<h2>첫 파트너: '+(p.shiny?'✨ ':'')+p.name+'</h2><button id="go">모험 시작</button>');$('go').onclick=hide}}
function render(){ctx.fillStyle='#94c47b';ctx.fillRect(0,0,320,240);for(let y=0;y<15;y++)for(let x=0;x<20;x++){let grass=(x>=4&&x<=7&&y>=5&&y<=7)||(x>=12&&x<=16&&y>=3&&y<=6);if(x<2||y<2||x>17||y>12){ctx.fillStyle='#4a8553';ctx.fillRect(x*16,y*16,16,16)}else if(grass){ctx.fillStyle='#508d49';ctx.fillRect(x*16,y*16,16,16);ctx.fillStyle='#326c3a';ctx.fillRect(x*16+3,y*16+3,3,9);ctx.fillRect(x*16+10,y*16+5,3,8)}else if((x*13+y*7)%11===0){ctx.fillStyle='#74ad61';ctx.fillRect(x*16+5,y*16+7,4,4)}}ctx.fillStyle='#c4b18a';ctx.fillRect(8*16,2*16,48,176);ctx.fillRect(32,128,256,32);ctx.fillStyle='#e0b774';ctx.fillRect(192,160,64,48);ctx.fillStyle='#b64c46';ctx.fillRect(192,144,64,16);ctx.fillStyle='#354f75';ctx.fillRect(s.x*16+3,s.y*16+8,10,7);ctx.fillStyle='#f2cfaa';ctx.fillRect(s.x*16+4,s.y*16+3,8,7);ctx.fillStyle='#bc3d3d';ctx.fillRect(s.x*16+2,s.y*16+1,12,4);$('info').textContent='타입 '+s.type+' · 파티 '+s.party.length+'/6 · 볼 '+s.balls;requestAnimationFrame(render)}
function move(dx,dy){if($('overlay').style.display==='flex'||foe)return;let x=Math.max(2,Math.min(17,s.x+dx)),y=Math.max(2,Math.min(12,s.y+dy));if(x>=12&&x<=15&&y>=10)return;s.x=x;s.y=y;save();if(((x>=4&&x<=7&&y>=5&&y<=7)||(x>=12&&x<=16&&y>=3&&y<=6))&&Math.random()<.16)encounter()}
document.querySelectorAll('[data-dir]').forEach(b=>{let timer;b.onpointerdown=e=>{e.preventDefault();let [x,y]=b.dataset.dir.split(',').map(Number);move(x,y);timer=setInterval(()=>move(x,y),150)};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>clearInterval(timer)});
function encounter(){let row=data[Math.floor(Math.random()*data.length)];foe=make(row[0],Math.random()<1/8192);foe.level=3+Math.floor(Math.random()*5);foe.max=foe.hp=14+foe.level*2;battle('야생 포켓몬 등장!')}
function battle(msg){let p=s.party.find(legal);if(!p){foe=null;show('<h3>전투 가능한 포켓몬이 없어!</h3><p>선택 타입 또는 이로치 포켓몬을 파티에 넣어줘.</p>');return}show('<h2>⚔️ 전투</h2><p>'+msg+'</p><p>야생 '+(foe.shiny?'✨ ':'')+foe.name+' Lv.'+foe.level+' HP '+foe.hp+'/'+foe.max+'</p><p>'+p.name+' Lv.'+p.level+' HP '+p.hp+'/'+p.max+'</p><button id="hit">공격</button><button id="catch">몬스터볼 '+s.balls+'</button><button id="run">도망</button>');$('hit').onclick=()=>{foe.hp=Math.max(0,foe.hp-4-Math.floor(Math.random()*7));if(!foe.hp){p.xp+=foe.level*3;if(p.xp>=p.level*5){p.xp=0;p.level++;p.max+=3;p.hp=p.max}foe=null;save();show('<h3>승리! 경험치 획득</h3><button id="done">확인</button>');$('done').onclick=hide;return}p.hp=Math.max(0,p.hp-1-Math.floor(Math.random()*4));if(!p.hp){p.hp=p.max;foe=null;save();show('<h3>포켓몬이 쓰러졌어!</h3><p>회복 후 다시 도전하자.</p>');return}battle('서로 공격을 주고받았어!')};$('catch').onclick=()=>{if(!s.balls)return;s.balls--;if(Math.random()<.35+(1-foe.hp/foe.max)*.5){let caught=foe;s.party.length<6?s.party.push(caught):s.box.push(caught);foe=null;save();show('<h3>포획 성공!</h3><p>'+(caught.shiny?'✨ ':'')+caught.name+' · '+(legal(caught)?'전투 가능':'수집 전용')+'</p><button id="done">확인</button>');$('done').onclick=hide}else battle('몬스터볼에서 탈출했어!')};$('run').onclick=()=>{foe=null;hide()}}
$('a').onclick=()=>{if($('overlay').style.display==='flex')return;if(s.x>=10&&s.x<=16&&s.y>=8){s.party.forEach(p=>p.hp=p.max);s.balls+=3;save();show('<h3>회복 완료</h3><p>몬스터볼 3개 획득!</p>')}else show('<p>여명지방의 바람이 불어온다.</p><p>풀숲에서 야생 포켓몬을 만날 수 있다.</p>')};$('menu').onclick=()=>{show('<h2>모험 메뉴</h2><p>타입: '+s.type+'</p><p>파티: '+s.party.map(p=>(p.shiny?'✨ ':'')+p.name+' Lv.'+p.level+(legal(p)?' ✓':' 수집 전용')).join(', ')+'</p><p>박스: '+s.box.length+'마리</p><button id="save">저장</button><button id="reset">새 게임</button>');$('save').onclick=()=>{save();show('<h3>저장 완료!</h3><button id="done">확인</button>');$('done').onclick=hide};$('reset').onclick=()=>{if(confirm('새 게임을 시작할까요?')){localStorage.removeItem('dawnLegacyV3');location.reload()}}};document.onkeydown=e=>{let keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(keys[e.key]){e.preventDefault();move(...keys[e.key])}if(e.key==='Escape')hide();if(e.key==='Enter')$('a').click()};render();if(!s.type)begin();
</script></body></html>
